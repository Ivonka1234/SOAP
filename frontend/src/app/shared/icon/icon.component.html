<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 24 24"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  aria-hidden="true"
>
  @switch (name()) {
    @case ('plane') {
      <path d="M21 8.5L14 11.5L9 7L4 8.5L6.5 12L4 15.5L9 17L14 12.5L21 15.5V8.5Z" fill="currentColor" opacity="0.25"/>
      <path d="M21 8.5L14 11.5L9 7L4 8.5L6.5 12L4 15.5L9 17L14 12.5L21 15.5V8.5Z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
      <path d="M9 7L6.5 12L9 17" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
    }
    @case ('flower') {
      <circle cx="12" cy="12" r="2.5" fill="currentColor"/>
      <ellipse cx="12" cy="7" rx="2.2" ry="3.2" fill="currentColor" opacity="0.7"/>
      <ellipse cx="12" cy="17" rx="2.2" ry="3.2" fill="currentColor" opacity="0.7"/>
      <ellipse cx="7" cy="12" rx="3.2" ry="2.2" fill="currentColor" opacity="0.7"/>
      <ellipse cx="17" cy="12" rx="3.2" ry="2.2" fill="currentColor" opacity="0.7"/>
    }
    @case ('sparkle') {
      <path d="M12 3L13.2 8.8L19 10L13.2 11.2L12 17L10.8 11.2L5 10L10.8 8.8L12 3Z" fill="currentColor"/>
      <path d="M19 15L19.8 18.2L23 19L19.8 19.8L19 23L18.2 19.8L15 19L18.2 18.2L19 15Z" fill="currentColor" opacity="0.6"/>
    }
    @case ('map') {
      <path d="M9 5L3 7V19L9 17L15 19L21 17V5L15 7L9 5Z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
      <path d="M9 5V17M15 7V19" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
    }
    @case ('pin') {
      <path d="M12 21C12 21 19 14.5 19 10C19 6.134 15.866 3 12 3C8.134 3 5 6.134 5 10C5 14.5 12 21 12 21Z" stroke="currentColor" stroke-width="1.75"/>
      <circle cx="12" cy="10" r="2.5" fill="currentColor"/>
    }
    @case ('calendar') {
      <rect x="4" y="5" width="16" height="15" rx="2.5" stroke="currentColor" stroke-width="1.75"/>
      <path d="M8 3V7M16 3V7M4 10H20" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
    }
    @case ('suitcase') {
      <rect x="5" y="8" width="14" height="11" rx="2" stroke="currentColor" stroke-width="1.75"/>
      <path d="M9 8V6.5C9 5.12 10.12 4 11.5 4H12.5C13.88 4 15 5.12 15 6.5V8" stroke="currentColor" stroke-width="1.75"/>
      <path d="M5 13H19" stroke="currentColor" stroke-width="1.75"/>
    }
    @case ('money') {
      <rect x="3" y="6" width="18" height="12" rx="2.5" stroke="currentColor" stroke-width="1.75"/>
      <circle cx="12" cy="12" r="2.8" stroke="currentColor" stroke-width="1.75"/>
      <path d="M7 9H7.01M17 15H17.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    }
    @case ('tag') {
      <path d="M20 12L12 20L4 12V4H12L20 12Z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
      <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/>
    }
    @case ('calendar-days') {
      <rect x="4" y="5" width="16" height="15" rx="2.5" stroke="currentColor" stroke-width="1.75"/>
      <path d="M8 3V7M16 3V7M4 10H20" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
      <rect x="8" y="13" width="3" height="3" rx="0.75" fill="currentColor" opacity="0.5"/>
      <rect x="13" y="13" width="3" height="3" rx="0.75" fill="currentColor" opacity="0.5"/>
    }
    @case ('warning') {
      <path d="M12 4L21 19H3L12 4Z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
      <path d="M12 10V13" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
      <circle cx="12" cy="16" r="1" fill="currentColor"/>
    }
    @case ('check') {
      <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.75"/>
      <path d="M8 12L11 15L16 9" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    }
    @case ('clock') {
      <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.75"/>
      <path d="M12 7V12L15.5 14" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    }
    @case ('dollar') {
      <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.75"/>
      <path d="M12 6V18M9.5 8.5C9.5 7.12 10.62 6 12 6C13.38 6 14.5 7.12 14.5 8.5C14.5 9.88 13.38 11 12 11C10.62 11 9.5 12.12 9.5 13.5C9.5 14.88 10.62 16 12 16C13.38 16 14.5 14.88 14.5 13.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
    }
    @case ('edit') {
      <path d="M4 17.5V20H6.5L17.8 8.7L15.3 6.2L4 17.5Z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
      <path d="M13.5 4.8L17.2 8.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
    }
    @case ('trash') {
      <path d="M5 7H19M9 7V5.5C9 4.67 9.67 4 10.5 4H13.5C14.33 4 15 4.67 15 5.5V7" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
      <path d="M8 7L9 19H15L16 7" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/>
    }
    @case ('star') {
      <path d="M12 4L14.2 9.2L20 10L15.5 13.8L16.8 19.5L12 16.5L7.2 19.5L8.5 13.8L4 10L9.8 9.2L12 4Z" fill="currentColor"/>
    }
    @case ('moon') {
      <path d="M20 14.5C18.7 16.4 16.4 17.7 13.8 17.7C9.6 17.7 6.3 14.4 6.3 10.2C6.3 7.6 7.6 5.3 9.5 4C6.5 4.8 4.3 7.6 4.3 11C4.3 15.6 8.1 19.4 12.7 19.4C16.1 19.4 19 17.2 20 14.5Z" fill="currentColor" opacity="0.85"/>
    }
    @case ('heart') {
      <path d="M12 19.5C12 19.5 4.5 14.2 4.5 9.2C4.5 6.5 6.6 4.5 9.2 4.5C10.7 4.5 12 5.3 12.8 6.5C13.6 5.3 14.9 4.5 16.4 4.5C19 4.5 21.1 6.5 21.1 9.2C21.1 14.2 12 19.5 12 19.5Z" fill="currentColor"/>
    }
  }
</svg>
